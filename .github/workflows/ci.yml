name: ci
on:
  push: { branches: [main] }
  pull_request:

env:
  SUPPORTIQ_ROOT: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-ci.txt }
      - run: pip install -r requirements-ci.txt
      - name: Tests (offline, no paid API calls)
        run: python -m pytest -q
